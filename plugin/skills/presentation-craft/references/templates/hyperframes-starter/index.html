<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Explainer Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #04080f;
        color: #eef4f9;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #backdrop {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #04080f;
      }
      .scene-host {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22.0"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="backdrop" data-layout-ignore="true"></div>

      <div
        id="scene-1-hook"
        class="scene-host"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="10.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-2-transform"
        class="scene-host"
        data-composition-id="scene-2-transform"
        data-composition-src="compositions/scene-2-transform.html"
        data-start="10.0"
        data-duration="12.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 22.0 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
