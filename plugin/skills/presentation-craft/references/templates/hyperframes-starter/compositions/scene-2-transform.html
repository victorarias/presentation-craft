  <div id="root" data-composition-id="scene-2-transform" data-width="1920" data-height="1080">

            <div id="s2-b-clip" class="clip s2-slot" data-start="2.2" data-duration="3.8" data-layout-ignore="true">

                <div class="s2-bar s2-bar-b"><span>Imperative Logic</span><span>Before</span></div>

              </div>

                <div class="s2-bar s2-bar-a"><span>Declarative Rules</span><span>After</span></div>
                <div class="s2-code">ACCEPTED_TYPES = ["audio", "ebook"];

  <script>
    window.__timelines = window.__timelines || {};
    const rootEl = document.getElementById("root");
    const canvas = document.getElementById("s2-canvas");
    const ctx = canvas.getContext("2d");

    function rectOf(id, rr) {
      const el = document.getElementById(id);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return null;
      return {
        left: r.left - rr.left,
        right: r.right - rr.left,
        cy: (r.top + r.bottom) / 2 - rr.top,
      };
    }

    function drawBeam(x1, y1, x2, y2, color, prog, t) {
      if (prog <= 0) return;
      const mx = (x1 + x2) / 2;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.78 * prog;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
      ctx.stroke();

      const u = ((t * 0.75) % 1) * prog;
      const inv = 1 - u;
      const px = inv*inv*inv*x1 + 3*inv*inv*u*mx + 3*inv*u*u*mx + u*u*u*x2;
      const py = inv*inv*inv*y1 + 3*inv*inv*u*y1 + 3*inv*u*u*y2 + u*u*u*y2;
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.95 * prog;
      ctx.beginPath();
      ctx.arc(px, py, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw(t) {
      ctx.clearRect(0, 0, 1920, 1080);
      const rr = rootEl.getBoundingClientRect();
      const after = rectOf("s2-a", rr);
      const core = rectOf("s2-core", rr);
      const out = rectOf("s2-out", rr);

      if (after && core && t >= 5.9) {
        drawBeam(after.right, after.cy, core.left, core.cy, "#22d3ee", Math.min(1, (t - 5.9) / 0.65), t);
      }
      if (core && out && t >= 6.9) {
        drawBeam(core.right, core.cy, out.left, out.cy, "#10b981", Math.min(1, (t - 6.9) / 0.65), t);
      }
    }

    const clock = { t: 0 };
    const tl = gsap.timeline({ paused: true, onUpdate: () => draw(clock.t) });
    tl.to(clock, { t: 12.0, duration: 12.0, ease: "none" }, 0);

    tl.fromTo("#s2-inter-inner", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.1);
    tl.to("#s2-inter-inner", { opacity: 0, y: -10, duration: 0.45, ease: "power2.inOut" }, 1.65);

    // Box-clipped scanline wipe
    tl.fromTo("#s2-b", { opacity: 0, y: 16, clipPath: "inset(0 0 0 0%)" }, { opacity: 1, y: 0, duration: 0.65, ease: "expo.out" }, 2.25);
    tl.to("#s2-b", { clipPath: "inset(0 0 0 100%)", duration: 1.0, ease: "power2.inOut" }, 4.55);
    tl.set("#s2-a", { clipPath: "inset(0 100% 0 0)" }, 4.5);
    tl.to("#s2-a", { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "power2.inOut" }, 4.55);
    tl.fromTo("#s2-beam", { x: -24, opacity: 0 }, { opacity: 1, duration: 0.16 }, 4.53);
    tl.to("#s2-beam", { x: 616, duration: 1.0, ease: "power2.inOut" }, 4.55);
    tl.to("#s2-beam", { opacity: 0, duration: 0.18 }, 5.45);
    tl.to("#s2-b", { opacity: 0, duration: 0.08 }, 5.6);

    tl.fromTo("#s2-core", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 5.95);
    tl.fromTo("#s2-out", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.65, ease: "expo.out" }, 6.95);
    tl.fromTo("#s2-whisper", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 7.9);
    tl.to("#root", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 11.45);

    window.__timelines["scene-2-transform"] = tl;
    tl.seek(0);
  </script>
